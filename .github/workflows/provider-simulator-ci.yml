name: Provider simulator CI

on:
  pull_request:
    paths:
      - "provider-reference/**"
      - ".github/workflows/provider-simulator-ci.yml"
  push:
    branches:
      - "feature/provider-integration-foundation"
    paths:
      - "provider-reference/**"
      - ".github/workflows/provider-simulator-ci.yml"

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check provider reference and simulator
        run: >-
          deno check
          provider-reference/wallet_orchestrator.ts
          provider-reference/wallet_orchestrator_test.ts
          provider-reference/simulator/server.ts
          provider-reference/simulator/server_test.ts
          provider-reference/partner_auth.ts
          provider-reference/partner_auth_test.ts

      - name: Run provider reference and simulator tests
        run: >-
          deno test
          provider-reference/wallet_orchestrator_test.ts
          provider-reference/simulator/server_test.ts
          provider-reference/partner_auth_test.ts
