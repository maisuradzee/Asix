name: Provider simulator CI

on:
  pull_request:
    paths:
      - "provider-reference/**"
      - ".github/workflows/provider-simulator-ci.yml"
  push:
    branches:
      - "feature/provider-integration-foundation"
    paths:
      - "provider-reference/**"
      - ".github/workflows/provider-simulator-ci.yml"

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check simulator and tests
        run: deno check provider-reference/simulator/server.ts provider-reference/simulator/server_test.ts

      - name: Run simulator tests
        run: deno test provider-reference/simulator/server_test.ts
