name: Publish ASIX Development Portal

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/asix-development-portal-pages.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_run:
    workflows: ["ASIX ST8 Autonomous Progression"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "asix-development-portal"
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'ASIX ST8 Autonomous Progression' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Test runtime evidence importer and provenance policy
        run: node --test tools/import-st8-runtime-evidence.test.mjs

      - name: Check PowerShell archive registration helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/Register-ST8-V080-Archive.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "ARCHIVE_REGISTRATION_POWERSHELL_SYNTAX_PASSED"

      - name: Download sanitized evidence from the canonical runtime run
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: asix-st8-public-runtime-summary
          path: ${{ runner.temp }}/asix-st8-runtime-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate new runtime evidence artifact
        id: runtime_evidence
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/asix-st8-runtime-evidence"
          input="$directory/asix-st8-public-summary.json"
          entries=0
          if [[ -d "$directory" ]]; then
            entries="$(find "$directory" -type f | wc -l | tr -d ' ')"
          fi
          if [[ -f "$input" && "$entries" == "1" ]]; then
            mkdir -p docs/data
            node tools/import-st8-runtime-evidence.mjs --validate-public-summary "$input" docs/data/runtime-evidence.json
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Accepted exactly one sanitized evidence file from the canonical run artifact."
          elif [[ "$entries" == "0" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No runtime evidence artifact was attached; existing published evidence will be retained."
          else
            echo "Unexpected files or layout in the runtime evidence artifact."
            find "$directory" -maxdepth 3 -type f -print || true
            exit 1
          fi

      - name: Restore previously published runtime evidence
        if: ${{ github.event_name != 'workflow_run' || steps.runtime_evidence.outputs.present != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p docs/data
          status_code="$(curl -sS -L -H "Cache-Control: no-cache" --max-time 20 -o "$RUNNER_TEMP/asix-st8-public-evidence.json" -w '%{http_code}' "https://maisuradzee.github.io/Asix/data/runtime-evidence.json?nocache=$GITHUB_RUN_ID" || true)"
          if [[ "$status_code" == "200" ]]; then
            node tools/import-st8-runtime-evidence.mjs --validate-public-summary "$RUNNER_TEMP/asix-st8-public-evidence.json" docs/data/runtime-evidence.json
          elif [[ "$status_code" == "404" ]]; then
            echo "No previously published runtime evidence exists yet."
          else
            echo "Could not safely preserve existing runtime evidence (HTTP $status_code)."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Refresh verified GitHub status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/data
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=integration%2Fst8-v0.7.1-alert-ops-hardening&per_page=20" > "$RUNNER_TEMP/st8-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/3" > "$RUNNER_TEMP/st8-pr.json"
          if [[ -f docs/data/runtime-evidence.json ]]; then
            cp docs/data/runtime-evidence.json "$RUNNER_TEMP/runtime-evidence.json"
          else
            printf 'null\n' > "$RUNNER_TEMP/runtime-evidence.json"
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          function readJson(file, description) {
            const raw = fs.readFileSync(file, "utf8");
            try {
              return JSON.parse(raw);
            } catch (error) {
              throw new Error(`Invalid JSON from ${description} (${file}, ${Buffer.byteLength(raw)} bytes): ${error.message}`);
            }
          }

          const runsDocument = readJson(process.env.RUNNER_TEMP + "/st8-runs.json", "GitHub Actions runs API");
          const pullRequest = readJson(process.env.RUNNER_TEMP + "/st8-pr.json", "PR #3 API");
          const runtimeEvidence = readJson(process.env.RUNNER_TEMP + "/runtime-evidence.json", "published runtime evidence");

          if (!Array.isArray(runsDocument.workflow_runs)) {
            throw new Error("GitHub Actions runs API did not return a workflow_runs array.");
          }
          if (pullRequest.number !== 3 || typeof pullRequest.state !== "string") {
            throw new Error("GitHub PR API response is not the expected PR #3 object.");
          }
          if (runtimeEvidence !== null && runtimeEvidence.schema !== "asix-st8-v0.9.0-public-runtime-summary/v1") {
            throw new Error("Published runtime evidence failed the public summary schema check.");
          }

          const latestCi = runsDocument.workflow_runs
            .filter((run) => run.name === "ASIX ST8 v0.9 Static Validation")
            .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)))[0] ?? null;

          const status = {
            generated_at: new Date().toISOString(),
            latest_ci: latestCi ? {
              name: latestCi.name,
              status: latestCi.status,
              conclusion: latestCi.conclusion,
              html_url: latestCi.html_url,
              updated_at: latestCi.updated_at,
              head_sha: latestCi.head_sha
            } : null,
            pr3: {
              state: pullRequest.state,
              draft: pullRequest.draft,
              merged: pullRequest.merged,
              html_url: pullRequest.html_url,
              updated_at: pullRequest.updated_at
            },
            runtime_evidence: runtimeEvidence
          };

          fs.writeFileSync("docs/data/status.json", JSON.stringify(status, null, 2) + "\n");
          console.log("PORTAL_STATUS_JSON_GENERATED");
          console.log("Static CI record:", latestCi ? latestCi.conclusion ?? latestCi.status : "none");
          console.log("PR #3 state:", pullRequest.state, "draft:", pullRequest.draft, "merged:", pullRequest.merged);
          console.log("Runtime evidence:", runtimeEvidence?.status ?? "not yet available");
          NODE

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
