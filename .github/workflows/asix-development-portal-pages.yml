name: Publish ASIX Development Portal

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/asix-development-portal-pages.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "asix-development-portal"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Refresh verified GitHub status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/data
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=integration%2Fst8-v0.7.1-alert-ops-hardening&per_page=10")"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/3")"
          jq -n \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson runs "$runs" \
            --argjson pr "$pr" \
            '{
              generated_at: $generated_at,
              latest_ci: (
                [$runs.workflow_runs[]? | {
                  name, status, conclusion, html_url, updated_at, head_sha
                }] | sort_by(.updated_at) | reverse | .[0] // null
              ),
              pr3: {
                state: $pr.state,
                draft: $pr.draft,
                merged: $pr.merged,
                html_url: $pr.html_url,
                updated_at: $pr.updated_at
              }
            }' > docs/data/status.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
