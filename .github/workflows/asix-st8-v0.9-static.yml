name: ASIX ST8 v0.9 Static Validation

on:
  push:
    branches:
      - integration/st8-v0.7.1-alert-ops-hardening
    paths:
      - "staging-candidates/v0.9.0/**"
      - ".github/workflows/asix-st8-v0.9-static.yml"
  pull_request:
    paths:
      - "staging-candidates/v0.9.0/**"
      - ".github/workflows/asix-st8-v0.9-static.yml"

permissions:
  contents: read

jobs:
  runner-static-validation:
    name: Runner syntax and dependency pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Check JavaScript syntax
        run: node --check staging-candidates/v0.9.0/concurrency-runner/run-concurrency-tests.mjs

      - name: Check PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "staging-candidates/v0.9.0/concurrency-runner/Start-Local-Postgres17-Test.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "LOCAL_POSTGRES_LAUNCHER_SYNTAX_PASSED"

      - name: Check service-role execution boundary
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const s = fs.readFileSync("staging-candidates/v0.9.0/concurrency-runner/run-concurrency-tests.mjs", "utf8");
            for (const token of [
              "set local role service_role",
              "service_callback_exec",
              "service_funding_exec",
              "anon_callback_exec",
              "authenticated_callback_exec",
              "anon_funding_exec",
              "authenticated_funding_exec"
            ]) {
              if (!s.includes(token)) throw new Error("Missing service-role safety contract: " + token);
            }
            console.log("SERVICE_ROLE_EXECUTION_BOUNDARY_PASSED");
          '

      - name: Verify pinned dependency and package metadata
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("staging-candidates/v0.9.0/concurrency-runner/package.json", "utf8"));
            if (p.version !== "0.9.0") throw new Error("Unexpected runner version");
            if (p.dependencies?.pg !== "8.16.3") throw new Error("pg dependency must remain pinned to 8.16.3");
            if (p.engines?.node !== ">=22.16.0") throw new Error("Unexpected Node.js engine constraint");
            console.log("V0_9_RUNNER_STATIC_VALIDATION_PASSED");
          '
