
name: ASIX ST8 Autonomous Progression

on:
  workflow_run:
    workflows:
      - "ASIX ST8 v0.9 Static Validation"
    types: [completed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: asix-st8-autonomous-progression
  cancel-in-progress: false

jobs:
  static:
    name: Stage 1 — static and safety gates
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'integration/st8-v0.7.1-alert-ops-hardening' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      static_status: ${{ steps.status.outputs.value }}
      bundle_present: ${{ steps.bundle.outputs.present }}
      candidate_sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Checkout ST8 candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'integration/st8-v0.7.1-alert-ops-hardening' }}
          path: candidate

      - name: Record candidate SHA
        id: sha
        working-directory: candidate
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Check runner JavaScript syntax
        run: node --check candidate/staging-candidates/v0.9.0/concurrency-runner/run-concurrency-tests.mjs

      - name: Check PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "candidate/staging-candidates/v0.9.0/concurrency-runner/Start-Local-Postgres17-Test.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Validate pinned runner package and service-role boundary
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root = "candidate/staging-candidates/v0.9.0/concurrency-runner/";
            const p = JSON.parse(fs.readFileSync(root + "package.json", "utf8"));
            const s = fs.readFileSync(root + "run-concurrency-tests.mjs", "utf8");
            if (p.version !== "0.9.0" || p.dependencies?.pg !== "8.16.3" || p.engines?.node !== ">=22.16.0") {
              throw new Error("Runner version, pg pin, or Node engine constraint changed unexpectedly.");
            }
            for (const token of [
              "set local role service_role",
              "service_callback_exec",
              "service_funding_exec",
              "anon_callback_exec",
              "authenticated_callback_exec",
              "anon_funding_exec",
              "authenticated_funding_exec"
            ]) {
              if (!s.includes(token)) throw new Error("Missing security contract: " + token);
            }
            console.log("RUNNER_PACKAGE_AND_SERVICE_ROLE_GATES_PASS");
          '

      - name: Detect pinned local migration bundle
        id: bundle
        run: |
          set -euo pipefail
          archive="candidate/staging-candidates/v0.9.0/runtime-migrations-bundle.zip"
          if [[ -f "$archive" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Wallet runtime is BLOCKED until the exact reviewed nine-migration bundle is committed."
          fi

      - name: Mark static stage
        id: status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "value=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "value=FAIL" >> "$GITHUB_OUTPUT"
          fi

  wallet-runtime:
    name: Stage 2 — PostgreSQL 17 wallet concurrency
    needs: static
    if: needs.static.outputs.static_status == 'PASS' && needs.static.outputs.bundle_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      runtime_status: ${{ steps.result.outputs.value }}
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: LocalOnly-ASIX-ST8-17
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.static.outputs.candidate_sha }}
          path: candidate

      - name: Checkout evidence sanitizer
        uses: actions/checkout@v4
        with:
          ref: main
          path: portal-main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install PostgreSQL client and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client unzip

      - name: Apply reviewed migrations and run C01–C12
        id: execute
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:LocalOnly-ASIX-ST8-17@127.0.0.1:5432/postgres
          ST8_TEST_PROJECT_REF: local-disposable-postgres17
          ST8_TEST_DATABASE_URL: postgresql://postgres:LocalOnly-ASIX-ST8-17@127.0.0.1:5432/postgres
          ST8_TEST_ALLOW_DISPOSABLE_DB: YES_I_UNDERSTAND_THIS_IS_A_DISPOSABLE_ST8_TEST_DATABASE
          ST8_TEST_WORKERS: "20"
          ST8_TEST_SSL: disable
          ST8_TEST_OUTPUT_DIR: ${{ github.workspace }}/candidate/concurrency-results
        run: |
          set -euo pipefail
          archive="candidate/staging-candidates/v0.9.0/runtime-migrations-bundle.zip"
          echo "51dcbc061ba3dda3c5c9105a5d67b7f841360070be4094d995ff00fd7e03d425  $archive" | sha256sum --check
          work="$RUNNER_TEMP/asix-st8-migrations"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"
          mapfile -t migrations < <(find "$work" -maxdepth 1 -type f -name '*.sql' | sort)
          if [[ ${#migrations[@]} -ne 9 ]]; then
            echo "Expected exactly 9 SQL migrations."
            exit 1
          fi

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY, aud text, role text, email text UNIQUE,
            encrypted_password text, email_confirmed_at timestamptz,
            raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            is_anonymous boolean NOT NULL DEFAULT false,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.jwt()
          RETURNS jsonb LANGUAGE sql STABLE
          AS $function$
            SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), ''), '{}')::jsonb
          $function$;
          GRANT USAGE ON SCHEMA auth TO service_role;
          GRANT EXECUTE ON FUNCTION auth.jwt() TO service_role;
          SQL

          for migration in "${migrations[@]}"; do
            echo "Applying $(basename "$migration")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

          cd candidate/staging-candidates/v0.9.0/concurrency-runner
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run test:concurrency

          report="$(find "$ST8_TEST_OUTPUT_DIR" -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
          test -n "$report"
          node "$GITHUB_WORKSPACE/portal-main/tools/import-st8-runtime-evidence.mjs" "$report" "$RUNNER_TEMP/asix-st8-runtime-summary.json"
          mkdir -p "$GITHUB_WORKSPACE/candidate/runtime-evidence"
          cp "$RUNNER_TEMP/asix-st8-runtime-summary.json" "$GITHUB_WORKSPACE/candidate/runtime-evidence/runtime-evidence.json"

      - name: Determine runtime result
        id: result
        if: always()
        run: |
          if [[ "${{ steps.execute.outcome }}" == "success" ]]; then
            echo "value=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "value=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload sanitized runtime evidence only
        if: steps.result.outputs.value == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: asix-st8-runtime-evidence
          path: candidate/runtime-evidence/runtime-evidence.json
          if-no-files-found: error
          retention-days: 30

  partner-preflight:
    name: Stage 3 — ST8 partner sandbox readiness
    needs: [static, wallet-runtime]
    if: always() && needs.static.outputs.static_status == 'PASS'
    runs-on: ubuntu-latest
    outputs:
      partner_status: ${{ steps.partner.outputs.value }}
    steps:
      - name: Check runtime gate and protected credential availability
        id: partner
        env:
          RUNTIME_STATUS: ${{ needs.wallet-runtime.outputs.runtime_status }}
          ST8_OPERATOR_CODE: ${{ secrets.ST8_OPERATOR_CODE }}
          ST8_SITE_ID: ${{ secrets.ST8_SITE_ID }}
          ST8_SANDBOX_API_URL: ${{ secrets.ST8_SANDBOX_API_URL }}
          ST8_PUBLIC_KEY: ${{ secrets.ST8_PUBLIC_KEY }}
          ASIX_ST8_KEY: ${{ secrets.ASIX_ST8_KEY }}
          ST8_TESTING_TOOL_URL: ${{ secrets.ST8_TESTING_TOOL_URL }}
        run: |
          set -euo pipefail
          if [[ "$RUNTIME_STATUS" != "PASS" ]]; then
            echo "value=BLOCKED_RUNTIME" >> "$GITHUB_OUTPUT"
          elif [[ -z "$ST8_OPERATOR_CODE" || -z "$ST8_SITE_ID" || -z "$ST8_SANDBOX_API_URL" || -z "$ST8_PUBLIC_KEY" || -z "$ASIX_ST8_KEY" || -z "$ST8_TESTING_TOOL_URL" ]]; then
            echo "value=BLOCKED_CREDENTIALS" >> "$GITHUB_OUTPUT"
          else
            echo "value=READY_FOR_PARTNER_TEST_TOOL" >> "$GITHUB_OUTPUT"
          fi

  progression-report:
    name: Stage 4 — machine-readable progression report
    needs: [static, wallet-runtime, partner-preflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create progression report
        env:
          STATIC_STATUS: ${{ needs.static.outputs.static_status }}
          BUNDLE_PRESENT: ${{ needs.static.outputs.bundle_present }}
          RUNTIME_STATUS: ${{ needs.wallet-runtime.outputs.runtime_status }}
          RUNTIME_JOB_RESULT: ${{ needs.wallet-runtime.result }}
          PARTNER_STATUS: ${{ needs.partner-preflight.outputs.partner_status }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ needs.static.outputs.candidate_sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          static = os.getenv("STATIC_STATUS") or "UNKNOWN"
          bundle = os.getenv("BUNDLE_PRESENT") == "true"
          runtime = os.getenv("RUNTIME_STATUS") or ("BLOCKED_MIGRATION_BUNDLE" if not bundle else os.getenv("RUNTIME_JOB_RESULT", "UNKNOWN").upper())
          partner = os.getenv("PARTNER_STATUS") or "NOT_REACHED"
          if static != "PASS":
              current = "STATIC_AND_SECURITY_GATES"
          elif runtime != "PASS":
              current = "WALLET_CONCURRENCY_RUNTIME"
          elif partner != "READY_FOR_PARTNER_TEST_TOOL":
              current = "ST8_PARTNER_SANDBOX_ACCEPTANCE"
          else:
              current = "PARTNER_TEST_TOOL_EXECUTION"
          report = {
              "schema": "asix-st8-autonomous-progression/v1",
              "workflow_run_id": os.getenv("WORKFLOW_RUN_ID"),
              "head_sha": os.getenv("HEAD_SHA"),
              "ref": os.getenv("REF_NAME"),
              "static_status": static,
              "migration_bundle_present": bundle,
              "wallet_runtime_status": runtime,
              "partner_preflight_status": partner,
              "current_stage": current,
              "production_release": "LOCKED",
              "pr3_merge": "PROHIBITED_WHILE_DRAFT"
          }
          os.makedirs("progression-report", exist_ok=True)
          with open("progression-report/progression.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload progression report
        uses: actions/upload-artifact@v4
        with:
          name: asix-st8-progression-report
          path: progression-report/progression.json
          retention-days: 30
