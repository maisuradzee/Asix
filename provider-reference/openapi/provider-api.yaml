openapi: 3.1.0
info:
  title: ASIX Partner Provider API
  version: 1.0.0
  description: |
    Partner-facing launch and session API proposal.
    Sandbox URL and schemas are examples only; no public ASIX endpoint is deployed by this specification.
servers:
  - url: https://provider-sandbox.example.invalid
    description: Placeholder sandbox host; replace only after a real environment is provisioned.
security:
  - AsixPartnerHmac: []
paths:
  /provider/v1/launches:
    post:
      operationId: createGameLaunch
      summary: Verify operator launch context and issue a short-lived game launch
      parameters:
        - $ref: '#/components/parameters/AsixPartnerCode'
        - $ref: '#/components/parameters/AsixKeyId'
        - $ref: '#/components/parameters/AsixTimestamp'
        - $ref: '#/components/parameters/AsixNonce'
        - $ref: '#/components/parameters/AsixSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchRequest'
      responses:
        '201':
          description: Launch issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /provider/v1/games:
    get:
      operationId: listPartnerGames
      summary: Return games enabled for the authenticated partner
      parameters:
        - $ref: '#/components/parameters/AsixPartnerCode'
        - $ref: '#/components/parameters/AsixKeyId'
        - $ref: '#/components/parameters/AsixTimestamp'
        - $ref: '#/components/parameters/AsixNonce'
        - $ref: '#/components/parameters/AsixSignature'
      responses:
        '200':
          description: Partner game catalogue
          content:
            application/json:
              schema:
                type: object
                required: [games]
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerGame'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /provider/v1/sessions/{sessionId}:
    get:
      operationId: getSessionStatus
      summary: Read minimal status for an authorized partner session
      parameters:
        - $ref: '#/components/parameters/AsixPartnerCode'
        - $ref: '#/components/parameters/AsixKeyId'
        - $ref: '#/components/parameters/AsixTimestamp'
        - $ref: '#/components/parameters/AsixNonce'
        - $ref: '#/components/parameters/AsixSignature'
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '404':
          description: Session not found in the authenticated partner scope
        '401':
          $ref: '#/components/responses/Unauthorized'
  /provider/v1/sessions/{sessionId}/close:
    post:
      operationId: requestSessionClose
      summary: Request controlled session closure; completed rounds remain immutable
      parameters:
        - $ref: '#/components/parameters/AsixPartnerCode'
        - $ref: '#/components/parameters/AsixKeyId'
        - $ref: '#/components/parameters/AsixTimestamp'
        - $ref: '#/components/parameters/AsixNonce'
        - $ref: '#/components/parameters/AsixSignature'
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Close request accepted for safe processing
        '404':
          description: Session not found in the authenticated partner scope
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    AsixPartnerHmac:
      type: apiKey
      in: header
      name: x-asix-signature
      description: |
        HMAC-SHA256 Base64 signature over:
        METHOD + newline + HOST + newline + PARTNER_CODE + newline + PATH_AND_QUERY +
        newline + TIMESTAMP_SECONDS + newline + NONCE + newline + SHA256_HEX_OF_RAW_BODY.
        Partner code, key ID, timestamp and nonce are supplied in companion x-asix headers.
  parameters:
    AsixPartnerCode:
      in: header
      name: x-asix-partner-code
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}
      in: header
      name: x-asix-key-id
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    AsixTimestamp:
      in: header
      name: x-asix-timestamp
      required: true
      schema: { type: string, pattern: '^[0-9]{10}$' }
    AsixNonce:
      in: header
      name: x-asix-nonce
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    AsixSignature:
      in: header
      name: x-asix-signature
      required: true
      schema: { type: string, contentEncoding: base64 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Invalid signature, expired timestamp or replayed nonce
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency or session-state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Partner request rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    LaunchRequest:
      type: object
      additionalProperties: false
      required: [partner_player_ref, partner_session_ref, game_code, currency, jurisdiction, locale]
      properties:
        partner_player_ref: { type: string, minLength: 1, maxLength: 200, description: Pseudonymous operator-side player ID }
        partner_session_ref: { type: string, minLength: 1, maxLength: 200 }
        game_code: { type: string, minLength: 1, maxLength: 80 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        jurisdiction: { type: string, minLength: 2, maxLength: 8 }
        locale: { type: string, minLength: 2, maxLength: 16 }
    LaunchResponse:
      type: object
      required: [launch_url, launch_token, expires_at, session_id]
      properties:
        launch_url: { type: string, format: uri }
        launch_token: { type: string, minLength: 32, description: Short-lived opaque token; never log it }
        expires_at: { type: string, format: date-time }
        session_id: { type: string, format: uuid }
    PartnerGame:
      type: object
      required: [game_code, version, currencies, locales]
      properties:
        game_code: { type: string }
        version: { type: string }
        currencies:
          type: array
          items: { type: string, pattern: '^[A-Z]{3}$' }
        locales:
          type: array
          items: { type: string }
    SessionStatus:
      type: object
      required: [session_id, state, game_code, currency, created_at]
      properties:
        session_id: { type: string, format: uuid }
        state: { type: string, enum: [CREATED, ACTIVE, PAUSED, COMPLETED, CANCELLED, EXCEPTION] }
        game_code: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [ok, error, correlation_id]
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            resolution: { type: string }
        correlation_id: { type: string, format: uuid }
 }
    AsixKeyId:
      in: header
      name: x-asix-key-id
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    AsixTimestamp:
      in: header
      name: x-asix-timestamp
      required: true
      schema: { type: string, pattern: '^[0-9]{10}$' }
    AsixNonce:
      in: header
      name: x-asix-nonce
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    AsixSignature:
      in: header
      name: x-asix-signature
      required: true
      schema: { type: string, contentEncoding: base64 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Invalid signature, expired timestamp or replayed nonce
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency or session-state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Partner request rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    LaunchRequest:
      type: object
      additionalProperties: false
      required: [partner_player_ref, partner_session_ref, game_code, currency, jurisdiction, locale]
      properties:
        partner_player_ref: { type: string, minLength: 1, maxLength: 200, description: Pseudonymous operator-side player ID }
        partner_session_ref: { type: string, minLength: 1, maxLength: 200 }
        game_code: { type: string, minLength: 1, maxLength: 80 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        jurisdiction: { type: string, minLength: 2, maxLength: 8 }
        locale: { type: string, minLength: 2, maxLength: 16 }
    LaunchResponse:
      type: object
      required: [launch_url, launch_token, expires_at, session_id]
      properties:
        launch_url: { type: string, format: uri }
        launch_token: { type: string, minLength: 32, description: Short-lived opaque token; never log it }
        expires_at: { type: string, format: date-time }
        session_id: { type: string, format: uuid }
    PartnerGame:
      type: object
      required: [game_code, version, currencies, locales]
      properties:
        game_code: { type: string }
        version: { type: string }
        currencies:
          type: array
          items: { type: string, pattern: '^[A-Z]{3}$' }
        locales:
          type: array
          items: { type: string }
    SessionStatus:
      type: object
      required: [session_id, state, game_code, currency, created_at]
      properties:
        session_id: { type: string, format: uuid }
        state: { type: string, enum: [CREATED, ACTIVE, PAUSED, COMPLETED, CANCELLED, EXCEPTION] }
        game_code: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [ok, error, correlation_id]
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            resolution: { type: string }
        correlation_id: { type: string, format: uuid }
